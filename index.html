<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sangam — Partner Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Main Content Container -->
    <main class="page-container">
      <header class="header">
        <span class="eyebrow">Tiruppur &bull; Gobichettipalayam</span>
        <h1 class="brand-title">Sangam</h1>
        <p class="brand-subtitle">The Distribution Point</p>
      </header>

      <div class="card-grid">
        <!-- Card 1: Eurogrip -->
        <button class="partner-card" onclick="showPopup('savsol')" type="button">
          <div class="image-stage">
            <img src="media/savsolester5.jpg" alt="Savsol Ester 5" />
          </div>
          <div class="card-body">
            <div class="card-text">
              <span class="pill">Engine Oil</span>
              <h2 class="card-title">Savsol Ester 5</h2>
            </div>
            <div class="arrow-icon" aria-hidden="true">&rarr;</div>
          </div>
        </button>

        <!-- Card 2: Valvoline -->
        <button class="partner-card" onclick="showPopup('valvoline')" type="button">
          <div class="image-stage">
            <img src="media/valvoline.png" alt="Valvoline Lubricants" />
          </div>
          <div class="card-body">
            <div class="card-text">
              <span class="pill">Lubricants</span>
              <h2 class="card-title">Valvoline</h2>
            </div>
            <div class="arrow-icon" aria-hidden="true">&rarr;</div>
          </div>
        </button>

        <!-- Card 3: Roots -->
        <button class="partner-card" onclick="showPopup('roots')" type="button">
          <div class="image-stage">
            <img src="media/roots.png" alt="Roots Accessories" />
          </div>
          <div class="card-body">
            <div class="card-text">
              <span class="pill">Electricals</span>
              <h2 class="card-title">Roots Auto</h2>
            </div>
            <div class="arrow-icon" aria-hidden="true">&rarr;</div>
          </div>
        </button>
      </div>
    </main>

    <!-- Refined Modal Dialog -->
    <div id="popupModal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-content">
          <h3 class="modal-heading">Application Required</h3>
          <p id="modalMessage" class="modal-copy">
            The scanner application for this brand partner isn't installed on your device. Please download it from your app store to continue.
          </p>
        </div>
        <div class="modal-actions">
          <button class="modal-btn" onclick="closePopup()">Dismiss</button>
        </div>
      </div>
    </div>

    
    <script src="js/popup.js"></script>
  </body>
</html>
